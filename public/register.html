<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar</title>
  <link rel="stylesheet" href="css/output.css" />
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">Buat akun baru</h1>
      <p class="mt-1 text-sm text-gray-500">Daftar untuk mulai belajar</p>
    </div>

    <form id="register-form" class="space-y-5" novalidate>
      <div>
        <label for="full_name" class="block text-sm font-medium text-gray-700 mb-1">Nama lengkap</label>
        <input id="full_name" name="full_name" type="text" autocomplete="name" required placeholder="Nama Anda"
          class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-gray-800 placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30" />
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="nama@email.com"
          class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-gray-800 placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="Minimal 8 karakter"
            class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-gray-800 placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30 pr-20" />
          <button type="button" data-toggle-password="password"
            class="absolute inset-y-0 right-0 px-3 text-sm font-medium text-gray-500 hover:text-gray-700"
            aria-label="Tampilkan password">Lihat</button>
        </div>
      </div>
      <div>
        <label for="confirm" class="block text-sm font-medium text-gray-700 mb-1">Konfirmasi password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required placeholder="Ulangi password"
          class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-gray-800 placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30" />
      </div>

      <p id="form-message" class="hidden" role="alert"></p>

      <button id="submit-btn" type="submit"
        class="w-full rounded-lg bg-blue-600 py-2.5 font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        Daftar
      </button>
    </form>

    <p class="mt-8 text-center text-sm text-gray-500">
      Sudah punya akun?
      <a href="index.html" class="font-medium text-blue-600 hover:text-blue-700 hover:underline">Login</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
