<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/output.css" />
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-xl">
    <img id="avatar" class="mx-auto mb-4 hidden h-16 w-16 rounded-full" alt="" />
    <h1 class="text-xl font-bold text-gray-800">Berhasil login</h1>
    <p id="user-email" class="mt-1 text-sm text-gray-500">Memuat...</p>
    <button id="logout"
      class="mt-6 w-full rounded-lg border border-gray-300 py-2.5 font-medium text-gray-700 hover:bg-gray-50">
      Logout
    </button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    (async () => {
      const { data } = await window.supabaseClient.auth.getSession();
      if (!data.session) return window.location.replace('index.html');

      const user = data.session.user;
      document.getElementById('user-email').textContent = user.email;
      const pic = user.user_metadata?.avatar_url;
      if (pic) {
        const img = document.getElementById('avatar');
        img.src = pic;
        img.classList.remove('hidden');
      }
    })();

    document.getElementById('logout').addEventListener('click', async () => {
      await window.supabaseClient.auth.signOut();
      window.location.replace('index.html');
    });
  </script>
</body>
</html>
